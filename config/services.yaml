parameters:
    ticket_proofs_directory: '%kernel.project_dir%/public/uploads/ticket_proofs'
    cron_token: '%env(CRON_TOKEN)%'
    net_forecasting_url: '%env(NET_FORECASTING_URL)%'
    security_ip_whitelist:
        - '127.0.0.1'
        - '::1'
        - 'localhost'


services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            
    App\Chatbot\ChatbotService:
        arguments:
            $ollamaUrl: '%env(OLLAMA_URL)%'
            $ollamaModel: 'llama3.1:8b'
    
    App\Service\FastApiPortDetector:
        arguments:
            $apiBaseUrl: '%env(default::PYTHON_API_BASE_URL)%'
    App\EventListener\TicketDeadlineListener:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
    App\Service\Security\IpBlocklistService:
        arguments:
            $ipWhitelist: '%security_ip_whitelist%'

    App\Service\DefaultUserInitializer:
        arguments:
            $defaultControllerUsername: '%env(DEFAULT_CONTROLLER_USERNAME)%'
            $defaultControllerPassword: '%env(DEFAULT_CONTROLLER_PASSWORD)%'